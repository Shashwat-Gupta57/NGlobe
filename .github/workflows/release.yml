name: Release installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    name: Build NGlobe-Setup.exe and attach it to the release
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build
      shell: cmd
      run: build.cmd

    - name: Attach to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.ref_name }}" dist/NGlobe-Setup.exe --clobber
