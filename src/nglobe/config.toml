# NGlobe configuration — every value here is optional (defaults live in config.py).
# To override per-user without editing the app, copy this file to ~/.nglobe/config.toml.
# Paths default to ~/.nglobe/ (database, logs, certificates, downloaded GeoIP data).

[proxy]
listen_port = 8888      # if busy, NGlobe picks a free port automatically

[server]
port = 8085             # web UI: http://127.0.0.1:8085
open_browser_on_start = true

[capture]
ignored_hosts = ["localhost", "127.0.0.1", "::1"]

[location]
auto_detect = true      # set false and fill latitude/longitude to pin your location
latitude = 0.0
longitude = 0.0
